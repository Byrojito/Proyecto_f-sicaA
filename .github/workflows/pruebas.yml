name: Pruebas

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Pruebas de la física (pytest)
        run: pytest -v
      - name: El notebook corre completo, de principio a fin
        run: jupyter nbconvert --to notebook --execute proyecto.ipynb --output /tmp/ejecutado.ipynb --ExecutePreprocessor.timeout=600
